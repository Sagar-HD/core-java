<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form action="vehicle" method="post">
        <label for="vehicle-number">Vehicle Number: </label>
        <input type="text" id="vehicle-number" name="vehicleNumber" required>
        <br>
        <label for="owner-name">Owner Name: </label>
        <input type="text" id="owner-name" name="ownerName" required>
        <br>
        <label for="vehicle-type">Vehicle Type: </label>
        <input type="text" id="vehicle-type" name="vehicleType" required>
        <br>
        <label for="reg-date">Registration Date: </label>
        <input type="date" id="reg-date" name="registrationDate" required>
        <br>
        <label for="insurance-date">Insurance Valid Till: </label>
        <input type="date" id="insurance-date" name="insuranceValidTill" required>
        <br>
        <label for="fuel-type">Fuel Type: </label>
        <input type="text" id="fuel-type" name="fuelType" required>
        <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
