<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form action="hotel" method="post">
        <label for="guest-name">Guest Name: </label>
        <input type="text" id="guest-name" name="guestName" required>
        <br>
        <label for="checkin-date">Check-in Date: </label>
        <input type="date" id="checkin-date" name="checkInDate" required>
        <br>
        <label for="checkout-date">Check-out Date: </label>
        <input type="date" id="checkout-date" name="checkOutDate" required>
        <br>
        <label for="room-type">Room Type: </label>
        <select id="room-type" name="roomType" required>
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Suite">Suite</option>
        </select>
        <br>
        <label for="num-guests">Number of Guests: </label>
        <input type="number" id="num-guests" name="numberOfGuests" required>
        <br>
        <label for="total-amount">Total Amount: </label>
        <input type="number" id="total-amount" name="totalAmount" step="0.01" required>
        <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
