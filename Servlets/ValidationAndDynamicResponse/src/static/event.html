<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form action="event" method="post">
        <label for="event-name">Event Name: </label>
        <input type="text" id="event-name" name="eventName" required>
        <br>
        <label for="organizer-name">Organizer Name: </label>
        <input type="text" id="organizer-name" name="organizerName" required>
        <br>
        <label for="event-date">Event Date: </label>
        <input type="date" id="event-date" name="eventDate" required>
        <br>
        <label for="venue">Venue: </label>
        <input type="text" id="venue" name="venue" required>
        <br>
        <label for="capacity">Capacity: </label>
        <input type="number" id="capacity" name="capacity" required>
        <br>
        <label for="registration-fee">Registration Fee: </label>
        <input type="number" id="registration-fee" name="registrationFee" step="0.01" required>
        <br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
